name: Study checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install study dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run checkpoint tests
        run: pytest
      - name: Validate quiz banks
        run: python quizzes/run_quiz.py --validate
